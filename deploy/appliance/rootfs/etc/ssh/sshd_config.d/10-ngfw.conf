# SJB-OS SSH policy (shipped by upgrade bundles; do not edit on the box).
# Operators get the captive CLI, never a Unix shell. Root logs
# in only with the key set at deploy time (root_ssh_key), for recovery;
# without one, root has no SSH access.
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication no
# Show /etc/issue.net before the password prompt.
Banner /etc/issue.net

Match User root
	# Written at first boot from the deploy settings; upgrades never touch it.
	AuthorizedKeysFile /etc/ngfw/root_authorized_keys
	PasswordAuthentication no

# SJB-OS users (group sjbadm, admin included): the captive CLI, whatever
# command or subsystem the client asks for. Their SSH keys are managed in
# the CLI and web UI (ngfwd writes /etc/ssh/sjb-keys/USER).
Match Group sjbadm
	ForceCommand /usr/local/sbin/sjb-cli
	DisableForwarding yes
	PermitTTY yes
	AuthorizedKeysFile /etc/ssh/sjb-keys/%u
