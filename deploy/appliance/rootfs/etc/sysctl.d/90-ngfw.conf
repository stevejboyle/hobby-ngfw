net.ipv4.ip_forward = 1
# Management runs in its own VRF (vrf-mgmt). Let sockets in the default VRF
# (sshd, the tag API) accept connections arriving there.
net.ipv4.tcp_l3mdev_accept = 1
net.ipv4.udp_l3mdev_accept = 1
# Send gratuitous ARPs when an interface comes up (or its MAC changes, as
# after a vMotion), so the upstream router's ARP cache follows the firewall.
net.ipv4.conf.all.arp_notify = 1
# The DHCP server (Kea) binds a socket to each served interface's address; on
# a VLAN in a VRF that address lives only in the VRF's table. Allow the bind
# (udp_l3mdev_accept above then lets that socket hear the VRF's traffic).
# What may reach the firewall is still decided by the input chain.
net.ipv4.ip_nonlocal_bind = 1
# App Identification counts bytes and packets per connection, and times it, when the
# connection ends (conntrack accounting and timestamps).
net.netfilter.nf_conntrack_acct = 1
net.netfilter.nf_conntrack_timestamp = 1
