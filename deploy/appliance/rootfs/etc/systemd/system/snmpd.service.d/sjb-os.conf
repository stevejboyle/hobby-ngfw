# SJB-OS: snmpd runs only while the config turns SNMP on (ngfwd writes
# /etc/snmp/snmpd.conf then, and removes it when SNMP is off, so the unit's
# ConditionPathExists keeps it from starting at boot).
[Unit]
After=ngfwd.service

[Service]
# Every start uses only the users in snmpd.conf: users net-snmp stored from
# an earlier run (with their old passphrases) would clash with them.
ExecStartPre=-/bin/sed -i "/^usmUser /d" /var/lib/snmp/snmpd.conf
# In the management VRF, so polls and traps use the management network.
# Debian's unit turns off the trigger modules (mteTrigger); SJB-OS's traps
# need them. No MIB files ship, so don't look for any.
ExecStart=
ExecStart=/usr/bin/ip vrf exec vrf-mgmt /usr/sbin/snmpd -LOw -u Debian-snmp -g Debian-snmp -I -smux -f
Environment=MIBS=
# A final inform to an unreachable receiver can hold up a stop.
TimeoutStopSec=10
Restart=on-failure
RestartSec=5
