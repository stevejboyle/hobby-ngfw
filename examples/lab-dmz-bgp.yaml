# SJB-OS lab: inside, DMZ and outside, with eBGP to the upstream router.
# Needs SJB-OS 0.9.11-r01 or later (inside as a trunk, log forwarding).
#
#   mgmt     192.168.1.0/24    SJB-OS 192.168.1.75 (deployment settings), gateway 192.168.1.1
#            a syslog server at 192.168.1.62 gets every log
#   outside  192.168.149.0/24  SJB-OS 192.168.149.254, upstream router 192.168.149.1
#   inside   192.168.150.0/24  SJB-OS 192.168.150.1, VLAN 150 on the inside trunk, DHCP .101-.199
#   dmz      192.168.151.0/24  SJB-OS 192.168.151.1, VLAN 151 on the inside trunk, a web server
#
# BGP: SJB-OS AS 65244 peers with 192.168.149.1 (AS 65534), announces only
# the DMZ (export filter dmz-only) and learns its default route there.
# Inside is private: an outbound allow-list (web, approved DNS, NTP, mail,
# ping) with the IPS, risky applications blocked, web decrypted, NATed to
# 192.168.149.254. The DMZ is routed by its real addresses: web from outside
# is allowed and inspected, the DMZ may go out, and never reaches inside.
# ESXi: the inside adapter's port group is a trunk (VLAN 4095).
# tools/lab-test.sh checks it from the inside client, the DMZ server and
# a machine outside; docs/lab-dmz-bgp-topology.html draws it.
#
# Load with `load` (it replaces the whole config), `commit -confirm 5m`, and
# `confirm` once `show bgp` shows the session up.

system:
    hostname: sjb-fw
    mgmt_interface: mgmt
    app_id: "on"
    ips: "on"
    decryption: "on"
zones:
    - name: inside
    - name: outside
    - name: dmz
interfaces:
    - name: mgmt
      zone: ""
    # The trunk: no zone, no address. VLANs 150 and 151 only; untagged traffic
    # is dropped.
    - name: inside
    - name: inside.150
      zone: inside
      address: 192.168.150.1/24
    - name: inside.151
      zone: dmz
      address: 192.168.151.1/24
    - name: outside
      zone: outside
      address: 192.168.149.254/24
addresses:
    - name: inside-net
      cidr: 192.168.150.0/24
    - name: home-lan
      cidr: 192.168.1.0/24
    - name: home-dns-1
      cidr: 192.168.1.97
    - name: home-dns-2
      cidr: 192.168.1.98
    - name: wifi-net
      cidr: 192.168.11.0/24
    - name: dmz-net
      cidr: 192.168.151.0/24
address_groups:
    - name: approved-dns
      static:
        - home-dns-1
        - home-dns-2
    - name: quarantine
      tag: quarantine
    - name: no-decrypt-hosts
      tag: no-decrypt
services:
    - name: http
      protocol: tcp
      ports: "80"
    - name: https
      protocol: tcp
      ports: "443"
    - name: dns-udp
      protocol: udp
      ports: "53"
    - name: dns-tcp
      protocol: tcp
      ports: "53"
    - name: ntp
      protocol: udp
      ports: "123"
    - name: mail-submission
      protocol: tcp
      ports: 465,587
    - name: imaps
      protocol: tcp
      ports: "993"
    - name: ping
      protocol: icmp
rules:
    - name: block-quarantined
      from:
        - inside
      source:
        - quarantine
      action: deny
      log: true
    - name: block-risky-apps
      from:
        - inside
      to:
        - outside
      application:
        - risky-apps
      action: reset
      log: true
    - name: dns-to-approved-resolvers
      from:
        - inside
      to:
        - outside
      destination:
        - approved-dns
      service:
        - dns-udp
        - dns-tcp
      action: allow
      log: true
      ips_profile: enterprise
    - name: block-other-dns
      from:
        - inside
      to:
        - outside
      service:
        - dns-udp
        - dns-tcp
      action: reset
      log: true
    - name: web
      from:
        - inside
      to:
        - outside
      service:
        - http
        - https
      action: allow
      log: true
      ips_profile: enterprise
    - name: time
      from:
        - inside
      to:
        - outside
      service:
        - ntp
      action: allow
      log: true
      ips_profile: enterprise
    - name: mail
      from:
        - inside
      to:
        - outside
      service:
        - mail-submission
        - imaps
      action: allow
      log: true
      ips_profile: enterprise
    - name: ping-out
      from:
        - inside
      to:
        - outside
      service:
        - ping
      action: allow
      log: true
    - name: deny-other-outbound
      from:
        - inside
      to:
        - outside
      action: deny
      log: true
    # DMZ (192.168.151.0/24): routed, announced over BGP, never reaches inside.
    - name: inside-to-dmz
      from:
        - inside
      to:
        - dmz
      source:
        - inside-net
      destination:
        - dmz-net
      action: allow
      log: true
    - name: dmz-to-inside
      from:
        - dmz
      to:
        - inside
      action: deny
      log: true
    - name: dmz-out
      from:
        - dmz
      to:
        - outside
      source:
        - dmz-net
      action: allow
      log: true
    - name: web-to-dmz
      from:
        - outside
      to:
        - dmz
      destination:
        - dmz-net
      service:
        - http
        - https
      action: allow
      log: true
      ips_profile: enterprise
    - name: deny-inbound
      from:
        - outside
      to:
        - inside
      action: deny
      log: true
    - name: deny-all
      action: deny
      log: true
application_groups:
    - name: risky-apps
      members:
        - category:VPN
        - category:Mining
        - BitTorrent
        - eDonkey
        - Gnutella
        - TeamViewer
        - AnyDesk
        - VNC
        - RDP
        - HTTP_Proxy
        - SOCKS
        - DoH_DoT
nat:
    - name: inside-out
      from:
        - inside
      to:
        - outside
      type: masquerade
routing:
    - name: default
      router_id: 192.168.149.254
      bgp_asn: 65244
      bgp_networks:
        - 192.168.151.0/24
bgp_neighbors:
    - name: upstream
      address: 192.168.149.1
      remote_as: 65534
      export: dmz-only    # only the DMZ leaves; accepts everything, incl. the default route
prefix_lists:
    - name: dmz-only
      entries:
        - permit 192.168.151.0/24
        - deny any
dhcp_servers:
    - name: inside.150
      range: 192.168.150.101-192.168.150.199
      gateway: 192.168.150.1
      dns:
        - 192.168.1.97
        - 192.168.1.98
      domain: sboyle.internal
ips_profiles:
    - name: enterprise
      critical: block
      major: block
      minor: alert
      informational: ignore
decryption_rules:
    - name: never-decrypt-tagged
      source:
        - no-decrypt-hosts
      action: no-decrypt
    - name: never-decrypt-home-lan
      destination:
        - home-lan
      action: no-decrypt
    - name: decrypt-users-web
      from:
        - inside
      to:
        - outside
      service:
        - https
      action: decrypt
      profile: enterprise
decryption_profiles:
    - name: enterprise
      bad_certificate: block
      unsupported: pass
      pinned: exclude
decryption_exclusions:
    - name: test-exclude
      domains:
        - www.sjbconsulting.ai
    - name: github
      domains:
        - raw.githubusercontent.com
    - name: os-updates-and-identity
      domains:
        - '*.apple.com'
        - '*.icloud.com'
        - '*.mzstatic.com'
        - '*.windowsupdate.com'
        - '*.update.microsoft.com'
        - '*.delivery.mp.microsoft.com'
        - login.microsoftonline.com
        - login.live.com
        - '*.okta.com'
        - accounts.google.com
    - name: collaboration-media
      domains:
        - '*.zoom.us'
        - '*.webex.com'
        - '*.teams.microsoft.com'
        - '*.skype.com'
    - name: pinned-apps
      domains:
        - '*.dropbox.com'
        - '*.whatsapp.net'
        - '*.signal.org'

log_servers:
    # Every log (traffic, threat, decryption, system) as JSON over the
    # management network. UDP 514 works with any syslog server; for TLS
    # (the default, port 6514) drop transport and port, and give the
    # server's CA with ca (or server_name, if a public CA signed it).
    - name: lab-syslog
      address: 192.168.1.62
      transport: udp
      port: 514

# Monitoring (0.9.13-r01 or later). Prometheus needs no config: add a key
# with request api-key add prometheus scopes metrics:read and scrape
# https://192.168.1.75:8443/metrics. For SNMP, add the credential first
# (request snmp credential add nms v3 auth sha256 priv aes; a commit naming
# a credential that doesn't exist is refused), then uncomment:
#
# snmp:
#     enabled: "on"
#     location: Lab
#     v3_users: [nms]
# snmp_trap_receivers:
#     # Link up/down, a service down, the IPS engine down, a commit failed,
#     # as acknowledged v3 informs to the monitoring host on mgmt.
#     - name: lab-nms
#       address: 192.168.1.62
#       credential: nms
#       inform: "on"
