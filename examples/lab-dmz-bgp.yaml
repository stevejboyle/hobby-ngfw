# SJB-OS lab: inside, DMZ and outside, with eBGP to the upstream router.
#
#   mgmt     192.168.1.0/24    SJB-OS 192.168.1.75, gateway 192.168.1.1
#   outside  192.168.149.0/24  SJB-OS 192.168.149.254, upstream router 192.168.149.1
#   inside   192.168.150.0/24  SJB-OS 192.168.150.1   (VLAN 150 on the inside trunk)
#   dmz      192.168.151.0/24  SJB-OS 192.168.151.1   (VLAN 151 on the inside trunk)
#
# BGP: SJB-OS AS 65244 peers with 192.168.149.1 (AS 65534) and announces only
# the DMZ. Inside is never announced: it leaves NATed to 192.168.149.254. The
# DMZ is routed, not NATed: the upstream router reaches it through the BGP
# route, by the DMZ hosts' real addresses. The default route is learned over
# BGP, so the upstream router must send 0.0.0.0/0.
#
# Deployment settings (the OVA's properties, not this file): mgmt_ip
# 192.168.1.75/24 and mgmt_gateway 192.168.1.1. The management interface is
# never in a zone and never filtered, so no commit can cut off access.
# ESXi: the inside network adapter's port group passes VLANs 150 and 151
# (VLAN 4095, a trunk).
#
# Load it with `load` in the CLI (it replaces the whole config) and commit
# with a confirm timer the first time: `commit -confirm 5m`, then `confirm` once `show bgp` shows the session up.

system:
  hostname: sjb-fw
  mgmt_interface: mgmt

zones:
  - name: inside
  - name: dmz
  - name: outside

interfaces:
  - name: mgmt
    address: 192.168.1.75/24          # informational: the deployment sets it
  - name: outside
    zone: outside
    address: 192.168.149.254/24
  # The trunk itself: no zone, no address (SJB-OS 0.9.10-r02 or later). It
  # carries VLANs 150 and 151 only; everything untagged is dropped, and the
  # deployment's inside_ip is taken off it.
  - name: inside
  - name: inside.150
    zone: inside
    address: 192.168.150.1/24
  - name: inside.151
    zone: dmz
    address: 192.168.151.1/24

addresses:
  - name: inside-net
    cidr: 192.168.150.0/24
  - name: dmz-net
    cidr: 192.168.151.0/24

services:
  - name: web
    protocol: tcp
    ports: 80,443

routing:
  - name: default
    router_id: 192.168.149.254
    bgp_asn: 65244
    bgp_networks: [192.168.151.0/24]

bgp_neighbors:
  - name: upstream
    address: 192.168.149.1
    remote_as: 65534
    description: upstream router
    export: dmz-only                  # only the DMZ leaves, whatever else is added later
    # no import list: accept every route the router sends, including the
    # default route (0.0.0.0/0), which is how inside and the DMZ reach the
    # internet. No static default: without the BGP session there is none.

prefix_lists:
  - name: dmz-only
    entries:
      - permit 192.168.151.0/24
      - deny any

nat:
  # Inside only: the DMZ is routed.
  - name: inside-out
    type: masquerade
    from: [inside]
    to: [outside]
    source: [inside-net]

rules:
  - name: inside-out
    from: [inside]
    to: [outside]
    source: [inside-net]
    action: allow
    log: true
  - name: inside-to-dmz
    from: [inside]
    to: [dmz]
    source: [inside-net]
    destination: [dmz-net]
    action: allow
    log: true
  - name: dmz-out
    from: [dmz]
    to: [outside]
    source: [dmz-net]
    action: allow
    log: true
  # The DMZ never reaches inside.
  - name: dmz-to-inside
    from: [dmz]
    to: [inside]
    action: deny
    log: true
  # From outside, web to the DMZ only, inspected by the IPS.
  - name: web-to-dmz
    from: [outside]
    to: [dmz]
    destination: [dmz-net]
    service: [web]
    action: allow
    log: true
    ips_profile: default
  # Everything else is denied (SJB-OS's default); this logs it.
  - name: deny-all
    action: deny
    log: true
