# SJB-OS SNMP agent: written by ngfwd from the running config. Don't edit:
# changes are overwritten at the next commit (set snmp ... in the CLI).

# Listen on every address; the firewall's input chain keeps zoned
# interfaces out, and snmpd runs in the management VRF.
agentAddress udp:161
sysName sjb-fw
sysLocation Lab rack 1
sysContact steve
sysServices 72

# Read-only access.
createUser nms SHA-256 "auth-pass-1" AES "priv-pass-1"
rouser -s usm nms priv

# snmpd's own queries (link and trigger monitors) use an internal user.
# net-snmp's internal queries can't encrypt, so it is auth-only, with
# a random passphrase that is never shown.
createUser sjb-internal SHA-256 "internal-passphrase-000"
rouser -s usm sjb-internal auth
iquerySecName sjb-internal
iqueryVersion 3
iquerySecLevel authNoPriv
agentSecName sjb-internal

# SJB-OS-MIB (.1.3.6.1.4.1.8072.9999.9999.7), served from ngfwd's monitoring snapshot.
pass_persist .1.3.6.1.4.1.8072.9999.9999.7 /usr/local/sbin/sjb-snmp-pass

